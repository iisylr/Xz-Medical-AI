# yaml-language-server: $schema=https://json.schemastore.org/spring-boot-application.json

server:
  port: 8081

spring:
  profiles:
    active: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/${MongoDB.database-name}
  datasource:
    url: jdbc:mysql://localhost:3306/${MySQL.database-name}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MySQL.username}
    password: ${MySQL.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

langchain4j:
  open-ai:
    chat-model:
      model-name: deepseek-v4-pro
      api-key: ${langchain4j.alibailian.api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
  community:
    dashscope:
      chat-model:
        api-key: ${langchain4j.alibailian.api-key}
        model-name: qwen3.6-max-preview
      embedding-model:
        api-key: ${langchain4j.alibailian.api-key}
        model-name: text-embedding-v4

logging:
  level:
    root: info
    com.atguigu: info
    dev.langchain4j: warn

# 开启mybatis-plus日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

elastic:
  serverless:
    endpoint: ${elastic.serverless.endpoint}
    api-key: ${elastic.serverless.api-key}
